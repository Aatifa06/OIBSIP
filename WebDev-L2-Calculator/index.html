<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaCalc — Scientific Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">
    <header class="header">
      <div class="brand">
        <div class="eyebrow">SCIENTIFIC CALCULATOR</div>
        <h1>Nova<span>Calc</span></h1>
        <p>Calculate more. Faster. Smarter.</p>
      </div>

      <div class="angle-switch">
        <button class="angle active" data-angle="DEG">Deg</button>
        <button class="angle" data-angle="RAD">Rad</button>
        <button class="angle" data-angle="GRAD">Grad</button>
      </div>
    </header>

    <section class="workspace">

      <div class="calculator-card">
        <div class="display">
          <div class="display-mode" id="displayMode">DEG</div>
          <div class="expression" id="expression">0</div>
          <div class="answer" id="answer">0</div>
        </div>

        <div class="memory-row">
          <button data-action="memory-clear">MC</button>
          <button data-action="memory-recall">MR</button>
          <button data-action="memory-add">M+</button>
          <button data-action="memory-subtract">M−</button>
          <button data-action="ans">Ans</button>
        </div>

        <div class="scientific-grid">
          <button data-action="function" data-value="sqrt(">¹√x</button>
          <button data-action="function" data-value="square">x²</button>
          <button data-action="function" data-value="cube">x³</button>
          <button data-action="function" data-value="inverse">1/x</button>
          <button data-action="function" data-value="factorial">x!</button>
          <button data-action="function" data-value="abs">|x|</button>
          <button data-action="input" data-value="(">(</button>
          <button data-action="input" data-value=")">)</button>

          <button class="pink-text" data-action="function" data-value="sin(">sin</button>
          <button class="pink-text" data-action="function" data-value="cos(">cos</button>
          <button class="pink-text" data-action="function" data-value="tan(">tan</button>
          <button data-action="function" data-value="asin(">sin⁻¹</button>
          <button data-action="function" data-value="acos(">cos⁻¹</button>
          <button data-action="function" data-value="atan(">tan⁻¹</button>
          <button data-action="function" data-value="log(">log</button>
          <button data-action="function" data-value="ln(">ln</button>

          <button data-action="function" data-value="10^">10ˣ</button>
          <button data-action="function" data-value="e^">eˣ</button>
          <button data-action="function" data-value="cbrt(">∛x</button>
          <button data-action="constant" data-value="pi">π</button>
          <button data-action="constant" data-value="e">e</button>
          <button data-action="input" data-value="%">%</button>
          <button data-action="input" data-value="^">xʸ</button>
          <button data-action="ans">Ans</button>
        </div>

        <div class="keypad">
          <button class="danger" data-action="clear">AC</button>
          <button data-action="backspace">⌫</button>
          <button data-action="input" data-value="(">(</button>
          <button data-action="input" data-value=")">)</button>
          <button class="operator" data-action="input" data-value="/">÷</button>

          <button data-action="input" data-value="7">7</button>
          <button data-action="input" data-value="8">8</button>
          <button data-action="input" data-value="9">9</button>
          <button data-action="input" data-value="%">%</button>
          <button class="operator" data-action="input" data-value="*">×</button>

          <button data-action="input" data-value="4">4</button>
          <button data-action="input" data-value="5">5</button>
          <button data-action="input" data-value="6">6</button>
          <button data-action="input" data-value=".">.</button>
          <button class="operator" data-action="input" data-value="-">−</button>

          <button data-action="input" data-value="1">1</button>
          <button data-action="input" data-value="2">2</button>
          <button data-action="input" data-value="3">3</button>
          <button data-action="input" data-value="00">00</button>
          <button class="operator" data-action="input" data-value="+">+</button>

          <button class="zero" data-action="input" data-value="0">0</button>
          <button class="equals" data-action="equals">=</button>
        </div>
      </div>

      <aside class="history-card">
        <div class="history-title">
          <div>
            <div class="eyebrow">RECENT</div>
            <h2>Calculation History</h2>
          </div>
          <button id="clearHistory">Clear</button>
        </div>
        <div id="historyList" class="history-list">
          <div class="empty-history">No calculations yet.</div>
        </div>
      </aside>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
